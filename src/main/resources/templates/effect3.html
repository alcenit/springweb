<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Círculos Concéntricos con Estela</title>
        <link th:href="@{/css/effect3.css}" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="nav-buttons">
                <a th:href="@{/}" class="nav-button">Volver al Efecto Fluido</a>
                <a th:href="@{/effect2}" class="nav-button">Ir a Efecto Estático</a>
            </div>

            <div class="title">
                <h1> Círculos Concéntricos con Estela</h1>

            </div>

            <div class="spring-info">
                <strong>Spring Boot 3.5.7</strong><br>
                Java 21 - Efecto Círculos
            </div>

            <canvas id="canvas"></canvas>

            <!-- Audio de fondo -->
            <div class="audio-controls">
                <h3>Sonido Ambiente</h3>
                <audio id="background-audio" loop>
                    <source src="/audio/backsound1.wav" type="audio/wav">
                    <source src="/audio/backsound2.wav" type="audio/wav">
                    Tu navegador no soporta audio HTML5.
                </audio>

                <div class="custom-audio-player">
                    <button id="play-pause-btn" class="audio-btn">
                        <i class="fi fi-rr-play"></i>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
                    <span class="volume-text">Volumen: <span id="volume-value">50%</span></span>
                </div>
            </div>




        </div>
        <div class="instructions">
            <p> Los puntos giran en círculos y su rastro que desaparece gradualmente</p>
        </div>

        <script th:src="@{/js/effect3.js}"></script>
    </body>
</html>
